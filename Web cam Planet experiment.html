<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gargantua - Seamless True-Depth Intersection</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #panel {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 20;
    width: 350px;
    padding: 24px;
    border-radius: 20px;
    background: rgba(4, 9, 24, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(168, 85, 247, 0.3);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #panel.hidden {
    opacity: 0;
    transform: translateY(-20px) scale(0.95);
    pointer-events: none;
  }

  #panel h2 {
    margin: 0 0 8px 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #c084fc 0%, #f43f5e 50%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #status {
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  #start-btn {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #9333ea 0%, #db2777 100%);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(147, 51, 234, 0.4);
    transition: all 0.2s ease;
  }

  #start-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #7e22ce 100%, #be185d 100%);
    box-shadow: 0 6px 24px rgba(147, 51, 234, 0.6);
    transform: translateY(-1px);
  }

  #start-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="panel">
  <h2>🌀 Gargantua Singularity</h2>
  <div id="status">Loading neural hand landmark tracker...</div>
  <button id="start-btn" disabled>🚀 Enter Singularity</button>
</div>

<video id="webcam" autoplay playsinline muted style="display: none;"></video>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const panel = document.getElementById('panel');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const video = document.getElementById('webcam');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);

let cameraRadius = 35;
let cameraTheta = 0.0;
let cameraPhi = Math.PI * 0.42;

function updateCameraPosition() {
  cameraPhi = Math.max(0.05, Math.min(Math.PI - 0.05, cameraPhi));
  camera.position.x = cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
  camera.position.y = cameraRadius * Math.cos(cameraPhi);
  camera.position.z = cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
  camera.lookAt(0, 0, 0);
}
updateCameraPosition();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- POST PROCESSING (BLOOM) ---
const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.4, 0.85);
bloomPass.threshold = 0.1;
bloomPass.strength = 0.6;
bloomPass.radius = 0.001;

const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

// --- 1. BLACK EVENT HORIZON SPHERE (Radius 3.7) ---
// Acts as the true occlusion core, hiding whatever disk geometry passes behind/through it.
const blackHoleMesh = new THREE.Mesh(
  new THREE.SphereGeometry(3.7, 64, 64),
  new THREE.MeshBasicMaterial({ 
    color: 0x000000,
    depthWrite: true,
    depthTest: true
  })
);
scene.add(blackHoleMesh);

// --- 2. CONTINUOUS ACCRETION DISK (Inner radius 1.5, passes THROUGH center) ---
const diskMat = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vPosition;
    void main() {
      vUv = uv;
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    varying vec2 vUv;
    varying vec3 vPosition;

    void main() {
      float dist = length(vPosition.xz);
      
      // Outer boundary cutoff
      if(dist > 15.5) discard;

      // Swirling angular coordinates
      float angle = atan(vPosition.z, vPosition.x);
      float radialFactor = clamp((dist - 1.5) / (15.5 - 1.5), 0.0, 1.0);

      // Doppler beaming effect
      float doppler = sin(angle - time * 2.0) * 0.5 + 0.5;

      // Turbulence pattern
      float noise = sin(dist * 6.0 - time * 4.0 + angle * 5.0) * 0.5 + 0.5;
      
      vec3 innerColor = vec3(1.2, 1.0, 0.5); // Blazing white-hot core
      vec3 midColor = vec3(0.9, 0.3, 0.05);   // Deep orange magma
      vec3 outerColor = vec3(0.3, 0.02, 0.5); // Purple dust fringe

      vec3 color = mix(innerColor, midColor, pow(radialFactor, 0.7));
      color = mix(color, outerColor, pow(radialFactor, 2.0));
      
      color *= (noise * 0.7 + 0.5) * (doppler * 0.8 + 0.6);

      // Brightest near the event horizon boundary, smoothly fading outward
      float alpha = smoothstep(15.5, 12.0, dist);

      gl_FragColor = vec4(color * 4.0, alpha);
    }
  `,
  side: THREE.DoubleSide,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const diskMesh = new THREE.Mesh(new THREE.RingGeometry(1.5, 15.5, 128, 64), diskMat);
diskMesh.rotation.x = Math.PI * 0.5;
scene.add(diskMesh);

// --- 3. GOLDEN PHOTON SPHERE / EINSTEIN RING GLOW (Radius ~4.25) ---
// Bridges the black sphere and disk seamlessly with additive glow
const photonRingMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.75 - dot(vNormal, vec3(0, 0, 1.0)), 2.5);
      gl_FragColor = vec4(1.0, 0.7, 0.25, 1.0) * intensity * 3.0;
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true,
  depthWrite: false,
  depthTest: true
});
const photonRingMesh = new THREE.Mesh(new THREE.SphereGeometry(4.25, 64, 64), photonRingMat);
scene.add(photonRingMesh);

// --- BACKGROUND STARFIELD ---
const starCount = 15000;
const starGeo = new THREE.BufferGeometry();
const starPositions = new Float32Array(starCount * 3);
const starColors = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
  const r = 500 + Math.random() * 1000;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 2 - 1);
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = r * Math.cos(phi);

  const shade = 0.5 + Math.random() * 0.5;
  starColors[i * 3] = shade * 0.8;
  starColors[i * 3 + 1] = shade * 0.9;
  starColors[i * 3 + 2] = shade * 1.2;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.9 })));

// --- HAND TRACKING CONTROLS ---
let handLandmarker = null;
let lastVideoTime = -1;
let prevHandPos = null;
let lastTimestamp = 0;
let velTheta = 0, velPhi = 0;
let prevHandPositions = null;
let targetRadius = 35;

async function setupHandTracking() {
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm');
    const filesetResolver = await vision.FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm'
    );
    handLandmarker = await vision.HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    statusEl.textContent = "Singularity tracker ready! Click below.";
    startBtn.disabled = false;
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error loading tracking module.";
  }
}
setupHandTracking();

startBtn.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    panel.classList.add('hidden');
    requestAnimationFrame(trackLoop);
  } catch (e) {
    alert("Camera access denied or unavailable.");
  }
};

function trackLoop(now) {
  if (video.readyState >= 2 && handLandmarker && video.currentTime !== lastVideoTime) {
    const results = handLandmarker.detectForVideo(video, now);
    processGestures(results, now);
    lastVideoTime = video.currentTime;
  }

  if (Math.abs(velTheta) > 0.00001 || Math.abs(velPhi) > 0.00001) {
    cameraTheta += velTheta;
    cameraPhi += velPhi;
    updateCameraPosition();
    velTheta *= 0.92;
    velPhi *= 0.92;
  }

  if (Math.abs(targetRadius - cameraRadius) > 0.01) {
    cameraRadius += (targetRadius - cameraRadius) * 0.18;
    updateCameraPosition();
  }

  requestAnimationFrame(trackLoop);
}

function processGestures(results, timestamp) {
  const dt = Math.max(16, timestamp - lastTimestamp);
  lastTimestamp = timestamp;
  const hands = results.landmarks;

  if (hands && hands.length === 2) {
    const h1 = hands[0][0], h2 = hands[1][0];
    if (prevHandPositions !== null) {
      const leftHCurrent = h1.x < h2.x ? h1 : h2;
      const rightHCurrent = h1.x < h2.x ? h2 : h1;
      const leftHPrev = prevHandPositions.left.x < prevHandPositions.right.x ? prevHandPositions.left : prevHandPositions.right;
      const rightHPrev = prevHandPositions.left.x < prevHandPositions.right.x ? prevHandPositions.right : prevHandPositions.left;

      const approachSpeed = (leftHCurrent.x - leftHPrev.x) - (rightHCurrent.x - rightHPrev.x);
      const zoomSpeed = 250;

      if (Math.abs(approachSpeed) > 0.0002) {
        targetRadius = approachSpeed > 0 ? 
          Math.min(120, targetRadius + approachSpeed * zoomSpeed) : 
          Math.max(12, targetRadius + approachSpeed * zoomSpeed);
      }
    }
    prevHandPositions = { left: { x: h1.x < h2.x ? h1.x : h2.x }, right: { x: h1.x < h2.x ? h2.x : h1.x } };
    prevHandPos = null;
    return;
  } else {
    prevHandPositions = null;
  }

  if (hands && hands.length === 1) {
    const hand = hands[0];
    const palmCenter = { x: hand[0].x, y: hand[0].y };

    if (prevHandPos !== null) {
      const dx = palmCenter.x - prevHandPos.x;
      const dy = palmCenter.y - prevHandPos.y;  
      const SENSITIVITY = 0.45; 
      const timeScale = Math.min(3, 1000 / dt);

      velTheta = dx * SENSITIVITY * timeScale;
      velPhi = -dy * SENSITIVITY * timeScale;  
    }
    prevHandPos = palmCenter;
  } else {
    prevHandPos = null;
  }
}

// Animation Loop
let clockTime = 0;
function animate(now) {
  requestAnimationFrame(animate);
  clockTime += 0.015;

  diskMat.uniforms.time.value = clockTime * 0.8;
  diskMesh.rotation.z = clockTime * 0.05;

  composer.render();
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
